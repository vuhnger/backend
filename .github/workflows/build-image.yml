name: Build image

# Build only after CI succeeds on main, so a red build never produces an
# image. Deploying the image is vuhnger/infra's job, not this repository's.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write # push the image to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }} # ghcr.io/vuhnger/backend

jobs:
  # 1) Build the image once, in CI, and push it to GHCR. The server no longer
  #    builds on the production host (slow, non-reproducible, competes for RAM).
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the exact commit CI validated
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Tag with the immutable commit SHA (for rollback) and moving `latest`
          # (what the compose file pulls by default).
          tags: |
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE }}:latest

      - name: Ask vuhnger/infra to deploy the image
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          VERSION: ${{ github.event.workflow_run.head_sha }}
        run: >-
          timeout 60 gh api --method POST repos/vuhnger/infra/dispatches
          -f event_type=backend-image-published
          -f "client_payload[version]=$VERSION"
