[project]
name = "backend"
version = "0.1.0"
description = "Personal backend services (Strava, WakaTime, n8n, projects)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # FastAPI and web server. Pydantic 2 + a Starlette new enough for httpx 0.28
    # (which dropped the TestClient `app=` shortcut).
    # Pinned exactly: an unpinned minor bump to 0.139 changed how include_router()
    # wraps routes, which silently disabled slowapi's rate limiting in production
    # while the tests stayed green. Bumps go through a PR, not through resolution.
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "pydantic>=2.7,<3.0",
    # Database
    "sqlalchemy>=2.0.35,<2.1",
    "psycopg2-binary==2.9.12",
    # External APIs. stravalib 2.x is a pydantic-2 rewrite (plain-number
    # quantities, changed iterators) — see apps/strava/client.py.
    "stravalib>=2.5,<3.0",
    # httpx is our sole HTTP client (sync + async). `requests` is no longer a
    # direct dependency — it stays in the lock only as a stravalib transitive.
    "httpx>=0.28,<0.29",
    # Security
    "cryptography==48.0.1",
    # File handling
    "aiofiles==25.1.0",
    "python-multipart==0.0.31",
    "alembic>=1.18.5",
    "filetype>=1.2.0",
    # Rate limiting is built straight on `limits` (see apps/shared/rate_limit.py);
    # slowapi was dropped because its route-introspection approach broke silently.
    "limits==5.8.0",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
]

[dependency-groups]
# Test + lint tooling. pytest-asyncio must track pytest's major line — 0.23.x
# caps at pytest<9, which is what broke the old requirements.txt. >=1.0 supports
# pytest 9.
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest==9.0.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
]

[tool.uv]
# The apps are run as modules (uvicorn apps.x.main:app) from the source tree,
# not installed as a distribution — so only resolve/install dependencies.
package = false

[tool.pytest.ini_options]
# Run from the repo root so `import apps.…` resolves without installing the pkg.
pythonpath = ["."]
testpaths = ["tests"]
# Let pytest-asyncio pick up `async def test_*` without per-test markers.
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Start enforceable and correctness-focused: pyflakes (undefined names, unused
# imports — real breakage) + syntax errors. Style/upgrade rules can be added
# later without blocking CI on pre-existing formatting choices.
select = ["F", "E9", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
follow_imports = "silent"
# Gradual typing: the shared infrastructure is type-checked and must stay clean.
# The app modules (strava/wakatime) lean heavily on framework/3rd-party types and
# aren't checked yet — add them here as they're annotated.
files = ["apps/shared"]
