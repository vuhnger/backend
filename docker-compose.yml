services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backend_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-backend_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backend_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  strava-api:
    image: ghcr.io/vuhnger/backend:${BACKEND_TAG:-latest}
    command: ["uvicorn", "apps.strava.main:app", "--host", "0.0.0.0", "--port", "5001"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/strava/openapi.json', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      # Database connection
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-backend_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-backend_db}

      # Environment mode
      ENVIRONMENT: ${ENVIRONMENT:-development}

      # Security keys
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      STATE_SECRET: ${STATE_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Strava OAuth
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI}

      # Frontend integration
      FRONTEND_URL: ${FRONTEND_URL:-https://vuhnger.dev}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  n8n-api:
    image: ghcr.io/vuhnger/backend:${BACKEND_TAG:-latest}
    command: ["uvicorn", "apps.n8n.main:app", "--host", "0.0.0.0", "--port", "5004"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5004:5004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5004/n8n/openapi.json', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks:
      - backend

  wakatime-api:
    image: ghcr.io/vuhnger/backend:${BACKEND_TAG:-latest}
    command: ["uvicorn", "apps.wakatime.main:app", "--host", "0.0.0.0", "--port", "5002"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:5002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5002/wakatime/openapi.json', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-backend_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-backend_db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      STATE_SECRET: ${STATE_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WAKATIME_CLIENT_ID: ${WAKATIME_CLIENT_ID}
      WAKATIME_CLIENT_SECRET: ${WAKATIME_CLIENT_SECRET}
      WAKATIME_REDIRECT_URI: ${WAKATIME_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL:-https://vuhnger.dev}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  projects-api:
    image: ghcr.io/vuhnger/backend:${BACKEND_TAG:-latest}
    command: ["uvicorn", "apps.projects.main:app", "--host", "0.0.0.0", "--port", "5005"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5005:5005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5005/projects/openapi.json', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /home/rocky/uploads:/home/rocky/uploads
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-backend_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-backend_db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      UPLOAD_DIR: /home/rocky/uploads/projects
      UPLOAD_BASE_URL: https://api.vuhnger.dev/uploads/projects
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  # Visitor beacon → pushes a notification on a new visit (no DB; ntfy via config).
  site-api:
    image: ghcr.io/vuhnger/backend:${BACKEND_TAG:-latest}
    command: ["uvicorn", "apps.site.main:app", "--host", "0.0.0.0", "--port", "5006"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5006:5006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5006/site/openapi.json', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      NTFY_URL: ${NTFY_URL}
      VISIT_NOTIFY_THROTTLE_SECONDS: ${VISIT_NOTIFY_THROTTLE_SECONDS:-3600}
      VISIT_NOTIFY_EXCLUDE_IPS: ${VISIT_NOTIFY_EXCLUDE_IPS:-}
    networks:
      - backend

  # Restarts any container Docker marks 'unhealthy' — the liveness-probe behaviour
  # that `restart: unless-stopped` doesn't cover (a hung-but-not-exited process).
  # Watches the per-service healthchecks defined above. Single-host alternative to
  # a k8s liveness probe. It needs the Docker socket (read-write) to issue restarts.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all   # watch every container that has a healthcheck
      AUTOHEAL_INTERVAL: "15"         # poll health every 15s
      AUTOHEAL_START_PERIOD: "30"     # give a restarted container time before re-checking
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Self-hosted, cookieless web analytics. Reuses the existing Postgres via a
  # dedicated `umami` database (create it once: CREATE DATABASE umami;). Serves
  # the dashboard + tracking script on :3000 — front it with caddy on a subdomain
  # (e.g. analytics.vuhnger.dev). Ships its own healthcheck, so autoheal watches it.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-backend_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
