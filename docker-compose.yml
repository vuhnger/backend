# Every app runs `uvicorn … --proxy-headers --forwarded-allow-ips "*"`. Without it
# uvicorn ignores X-Forwarded-For, so request.client.host — and therefore every
# access-log line — reads as the docker gateway instead of the real visitor.
# Trusting "*" is safe here: the ports below are bound to 127.0.0.1, so only caddy
# can reach them, and caddy overwrites X-Forwarded-For rather than appending to a
# client-supplied value.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backend_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-backend_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backend_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  strava-api:
    image: ghcr.io/vuhnger/backend:${BACKEND_TAG:-latest}
    command: ["uvicorn", "apps.strava.main:app", "--host", "0.0.0.0", "--port", "5001", "--proxy-headers", "--forwarded-allow-ips", "*"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/strava/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      # Database connection
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-backend_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-backend_db}

      # Environment mode
      ENVIRONMENT: ${ENVIRONMENT:-development}

      # Security keys
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      STATE_SECRET: ${STATE_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Strava OAuth
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI}

      # Heatmap privacy clipping. Without the coordinate /strava/heatmap refuses
      # to serve (503) rather than publish untrimmed tracks, so these have to be
      # listed here explicitly -- this service has no env_file, which means the
      # host .env only reaches the container through the names spelled out below.
      STRAVA_HOME_LAT: ${STRAVA_HOME_LAT}
      STRAVA_HOME_LNG: ${STRAVA_HOME_LNG}
      STRAVA_PRIVACY_RADIUS_M: ${STRAVA_PRIVACY_RADIUS_M:-500}

      # Frontend integration
      FRONTEND_URL: ${FRONTEND_URL:-https://vuhnger.dev}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  n8n-api:
    image: ghcr.io/vuhnger/backend:${BACKEND_TAG:-latest}
    command: ["uvicorn", "apps.n8n.main:app", "--host", "0.0.0.0", "--port", "5004", "--proxy-headers", "--forwarded-allow-ips", "*"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5004:5004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5004/n8n/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks:
      - backend

  wakatime-api:
    image: ghcr.io/vuhnger/backend:${BACKEND_TAG:-latest}
    command: ["uvicorn", "apps.wakatime.main:app", "--host", "0.0.0.0", "--port", "5002", "--proxy-headers", "--forwarded-allow-ips", "*"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:5002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5002/wakatime/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-backend_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-backend_db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      STATE_SECRET: ${STATE_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WAKATIME_CLIENT_ID: ${WAKATIME_CLIENT_ID}
      WAKATIME_CLIENT_SECRET: ${WAKATIME_CLIENT_SECRET}
      WAKATIME_REDIRECT_URI: ${WAKATIME_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL:-https://vuhnger.dev}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  projects-api:
    image: ghcr.io/vuhnger/backend:${BACKEND_TAG:-latest}
    command: ["uvicorn", "apps.projects.main:app", "--host", "0.0.0.0", "--port", "5005", "--proxy-headers", "--forwarded-allow-ips", "*"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5005:5005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5005/projects/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ${UPLOAD_HOST_DIR:-./uploads}:/uploads
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-backend_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-backend_db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      UPLOAD_DIR: /uploads/projects
      UPLOAD_BASE_URL: https://api.vuhnger.dev/uploads/projects
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  # Visitor beacon → pushes a notification on a new visit (no DB; ntfy via config).
  site-api:
    image: ghcr.io/vuhnger/backend:${BACKEND_TAG:-latest}
    # --timeout-graceful-shutdown is here and nowhere else: uvicorn's default is
    # to wait indefinitely for open connections, which is harmless for request/
    # response services but not for one holding WebSockets. A single client that
    # ignores the close frame would otherwise pin the container until Docker's
    # SIGKILL at 10s, turning every deploy into a hard kill.
    command: ["uvicorn", "apps.site.main:app", "--host", "0.0.0.0", "--port", "5006", "--proxy-headers", "--forwarded-allow-ips", "*", "--timeout-graceful-shutdown", "5"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5006:5006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5006/site/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      NTFY_URL: ${NTFY_URL}
      VISIT_NOTIFY_THROTTLE_SECONDS: ${VISIT_NOTIFY_THROTTLE_SECONDS:-3600}
      VISIT_NOTIFY_EXCLUDE_IPS: ${VISIT_NOTIFY_EXCLUDE_IPS:-}

      # CORS origin list for the cursor WebSocket. Same list as HTTP — this
      # service has no env_file, so a name not spelled out here never reaches
      # the container and the origin check silently falls back to the defaults.
      FRONTEND_URL: ${FRONTEND_URL:-https://vuhnger.dev}

      # Live cursor presence. Defaults in apps/shared/config.py are sized for
      # this box; they are here so they can be turned down without a redeploy.
      # Note the uvicorn command above runs a single worker, which the in-memory
      # hub requires: a second worker would split the rooms in half.
      CURSOR_MAX_CONNECTIONS: ${CURSOR_MAX_CONNECTIONS:-200}
      CURSOR_MAX_PER_ROOM: ${CURSOR_MAX_PER_ROOM:-50}
      CURSOR_MAX_PER_IP: ${CURSOR_MAX_PER_IP:-5}
      CURSOR_MAX_ROOMS: ${CURSOR_MAX_ROOMS:-100}
      CURSOR_TICK_HZ: ${CURSOR_TICK_HZ:-15}
      CURSOR_MAX_MESSAGES_PER_SECOND: ${CURSOR_MAX_MESSAGES_PER_SECOND:-60}
      CURSOR_IDLE_TIMEOUT_SECONDS: ${CURSOR_IDLE_TIMEOUT_SECONDS:-900}
      CURSOR_SEND_QUEUE_SIZE: ${CURSOR_SEND_QUEUE_SIZE:-64}
    networks:
      - backend

  # Restarts any container Docker marks 'unhealthy' — the liveness-probe behaviour
  # that `restart: unless-stopped` doesn't cover (a hung-but-not-exited process).
  # Watches the per-service healthchecks defined above. Single-host alternative to
  # a k8s liveness probe. It needs the Docker socket (read-write) to issue restarts.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all   # watch every container that has a healthcheck
      AUTOHEAL_INTERVAL: "15"         # poll health every 15s
      AUTOHEAL_START_PERIOD: "30"     # give a restarted container time before re-checking
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Self-hosted, cookieless web analytics. Reuses the existing Postgres via a
  # dedicated `umami` database (create it once: CREATE DATABASE umami;). Serves
  # the dashboard + tracking script on :3000 — front it with caddy on a subdomain
  # (e.g. analytics.vuhnger.dev). Ships its own healthcheck, so autoheal watches it.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-backend_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
